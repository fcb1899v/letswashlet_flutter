org.gradle.jvmargs=-Xmx2048M -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# Held at false: these plugins still apply KGP unconditionally and AGP 9
# rejects that under built in Kotlin -- audio_session, device_info_plus, firebase_analytics, webview_flutter_android
android.builtInKotlin=false
# Matches the other apps: AGP 9 new DSL off while KGP is still in use
android.newDsl=false
