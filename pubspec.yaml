name: letswashlet
description: washlet simulator.
publish_to: 'none'
version: 1.1.9+19

environment:
  # 3.47 is the floor, not 3.3: Android Gradle Plugin 9 rejects the Kotlin
  # Gradle Plugin being applied on top, and Flutter forces it onto plugin
  # modules until 3.47 adds the isBuiltInKotlinEnabled guard. Declaring 3.3
  # let `pub get` succeed and the Android build fail later with an error
  # that names neither.
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  webview_flutter_android: ^4.14.1
  webview_flutter: ^4.14.1
  # Firebase Analytics
  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0
  # App Icon
  cupertino_icons: ^1.0.9
  flutter_launcher_icons: ^0.14.4
  # Audio Player
  just_audio: ^0.10.6
  # Vibration
  vibration: ^3.2.0
  # Admob
  google_mobile_ads: ^9.1.0
  #env
  flutter_dotenv: ^6.0.1
  #MVVM
  hooks_riverpod: ^3.4.2
  flutter_hooks: ^0.21.3+1
  # App Splash
  flutter_native_splash: ^2.4.8
  # Localize
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

# 2.6.0 ships no Package.swift while 2.5.1 does, and a single plugin without one
# makes Flutter fall back to CocoaPods for the whole iOS build
# (darwin_dependency_management.dart:89). Lift when SPM support returns.
dependency_overrides:
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_icons:
  image_path: "assets/images/icon.png"
  android: true
  ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/appIcon.png"

flutter_native_splash:
  image: "assets/images/icon.png"
  color: "#ffffff"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audios/
    - assets/.env

  fonts:
    - family: roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
    - family: cornerStone
      fonts:
        - asset: assets/fonts/cornerstone.ttf
